worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 0;

  gzip on;
  gzip_types application/json application/javascript text/css text/plain;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream cerevi_web {
    server web:5173;
    keepalive 32;
  }

  upstream visor_image_validator {
    server validator:5174;
    keepalive 32;
  }

  upstream cerevi_server {
    server server:8000;
    keepalive 32;
  }

  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx_certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx_certs/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    proxy_http_version 1.1;
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /health {
      proxy_pass http://cerevi_server;
    }

    location = /openapi.json {
      proxy_pass http://cerevi_server;
    }

    location ^~ /docs {
      proxy_pass http://cerevi_server;
    }

    location ^~ /redoc {
      proxy_pass http://cerevi_server;
    }

    location ^~ /registry/ {
      proxy_pass http://cerevi_server;
    }

    location ^~ /specimens/ {
      proxy_pass http://cerevi_server;
    }

    location ^~ /atlas/ {
      proxy_buffering off;
      proxy_pass http://cerevi_server;
    }

    location ^~ /meshes/ {
      proxy_buffering off;
      proxy_pass http://cerevi_server;
    }

    location ^~ /ome-zarr/ {
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_pass http://cerevi_server;
    }

    location /data/ {
        alias /mnt/data/;
        add_header Accept-Ranges bytes always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

        # Optional: aggressive caching for immutable chunks
        # location ~* /c/ {
        #     expires 30d;
        #     add_header Cache-Control "public, immutable";
        # }
    }

    location / {
      proxy_pass http://cerevi_web;
    }
  }

  server {
    listen 444 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx_certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx_certs/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    proxy_http_version 1.1;
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /health {
