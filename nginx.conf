    }

    location ^~ /registry/ {
      proxy_pass http://cerevi_server;
    }

    location ^~ /specimens/ {
      proxy_pass http://cerevi_server;
    }

    location ^~ /atlas/ {
      proxy_buffering off;
      proxy_pass http://cerevi_server;
    }

    location ^~ /meshes/ {
      proxy_buffering off;
      proxy_pass http://cerevi_server;
    }

    location ^~ /ome-zarr/ {
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_pass http://cerevi_server;
    }

    location /data/ {
        alias /mnt/data/;
        add_header Accept-Ranges bytes always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

        # Optional: aggressive caching for immutable chunks
        # location ~* /c/ {
        #     expires 30d;
        #     add_header Cache-Control "public, immutable";
        # }
    }

    location / {
      proxy_pass http://visor_image_validator;
    }
  }
}